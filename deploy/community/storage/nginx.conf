# CybeDefend Community Edition: the service `storage`, a TCP relay that owns the
# storage's network namespace; SeaweedFS (storage-server) joins it
# (network_mode: service:storage).
#
# SeaweedFS listens on the namespace loopback only: its S3 API on 8333 and, on
# 18333, the S3 gRPC API it always serves next to it (SeaweedS3IamCache:
# PutIdentity, PutPolicy… with no authentication). This relay is the only
# listener on the network: 0.0.0.0:9000 → 127.0.0.1:8333, bytes untouched (a
# stream, not an HTTP proxy), so the Host header that SigV4 and the presigned
# URLs sign reaches SeaweedFS as the client sent it.

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

stream {
  server {
    listen 0.0.0.0:9000;
    proxy_pass 127.0.0.1:8333;
    proxy_connect_timeout 5s;
  }
}
