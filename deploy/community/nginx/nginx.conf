worker_processes 1;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # No nginx version in the Server header nor on error pages.
    server_tokens off;

    # The access log writes no invitation or webhook token and no query
    # string: the segment after /invite/ (the invitation page, which accepts
    # with the token alone), after /api/auth/invitations/ and after
    # /api/webhooks/jira/ (the secret that authenticates Jira's calls) is
    # written ***, in the request and in the Referer, and every query string
    # is dropped (a reset link carries its token there). nginx's own error log still names a request
    # it failed to serve (an unreachable gateway, for example).
    map $request_uri $cd_log_uri {
        "~^(?<cd_u_pre>/+invite/)[^/?]*(?<cd_u_rest>[^?]*)"                    "${cd_u_pre}***${cd_u_rest}";
        "~^(?<cd_u_pre>/+api/+auth/+invitations/)[^/?]*(?<cd_u_rest>[^?]*)"    "${cd_u_pre}***${cd_u_rest}";
        "~^(?<cd_u_pre>/+api/+webhooks/+jira/)[^/?]*(?<cd_u_rest>[^?]*)"      "${cd_u_pre}***${cd_u_rest}";
        "~^(?<cd_u_path>[^?]*)"                                                $cd_u_path;
    }

    map $http_referer $cd_log_referer {
        ""                                                                              "-";
        "~^(?<cd_r_pre>[^?#]*?/invite/)[^/?#]*(?<cd_r_rest>[^?#]*)"                     "${cd_r_pre}***${cd_r_rest}";
        "~^(?<cd_r_pre>[^?#]*?/api/+auth/+invitations/)[^/?#]*(?<cd_r_rest>[^?#]*)"     "${cd_r_pre}***${cd_r_rest}";
        "~^(?<cd_r_pre>[^?#]*?/api/+webhooks/+jira/)[^/?#]*(?<cd_r_rest>[^?#]*)"       "${cd_r_pre}***${cd_r_rest}";
        "~^(?<cd_r_path>[^?#]*)"                                                        $cd_r_path;
    }

    # The combined format, with the masked request line and Referer.
    log_format cd_masked '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $cd_log_uri $server_protocol" $status $body_bytes_sent '
                         '"$cd_log_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log cd_masked;

    include /tmp/conf.d/*.conf;
}
