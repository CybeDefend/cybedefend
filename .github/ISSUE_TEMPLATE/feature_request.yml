name: Feature request
description: Propose a change or a new feature for the Community Edition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen.
    validations:
      required: true
  - type: checkboxes
    id: community-or-paid
    attributes:
      label: Community or paid
      description: >-
        The section « What belongs to the Community Edition » of
        CONTRIBUTING.md says how we decide whether a feature belongs to the
        Community Edition.
      options:
        - label: Have you read the Community-or-paid section of CONTRIBUTING.md?
          required: true
