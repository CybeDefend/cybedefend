name: CLA

# CLA Assistant: asks each contributor to sign CLA.md once, and records the
# signatures on the cla-signatures branch. The check is named CLA; a
# maintainer imports a pull request only once it has passed.
#
# pull_request_target runs with a write token, so this workflow never checks
# out or runs code from the pull request: it has one step, the action, which
# reads the pull request through the API only.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions: {}

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/CybeDefend/cybedefend/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
