# Default server of the Community image (`Dockerfile`).
# It serves the single-page app on its own: the API lives elsewhere, at the
# address config.js names (CYBEDEFEND_API_URL, default /api). Behind the
# compose, the front nginx is mounted in its place: it proxies /api to the
# gateway and owns the CSP.
#
# The dashboard calls its API on its own origin, so connect-src is 'self'.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Written at container start (docker-entrypoint.d/40-cybedefend-config.sh):
    # never cached, or a changed API address waits for a cache to expire. An
    # add_header here drops the server's, so they are repeated.
    location = /config.js {
        add_header Cache-Control "no-store" always;  # cybedefend-ignore[CD-SAST-0187]: this location repeats every security header of the server block, so none is lost
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;  # cybedefend-ignore[CD-SAST-0187]: this location repeats every security header of the server block, so none is lost
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # cybedefend-ignore[CD-SAST-0187]: this location repeats every security header of the server block, so none is lost
        add_header X-Content-Type-Options "nosniff" always;  # cybedefend-ignore[CD-SAST-0187]: this location repeats every security header of the server block, so none is lost
        add_header X-Frame-Options "DENY" always;  # cybedefend-ignore[CD-SAST-0187]: this location repeats every security header of the server block, so none is lost
        try_files /config.js =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
