server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SECURITY headers. Mirror of the prod-preview policy in vite.config.ts:
    # keep both files in sync when adding a third-party origin. The dashboard
    # calls its API on its own origin, so connect-src is 'self'. Fonts are
    # served from /fonts/ (public/fonts): font-src and style-src name no font host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
