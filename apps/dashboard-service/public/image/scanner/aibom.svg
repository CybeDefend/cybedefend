<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="58" fill="#1a1a2e" opacity="0.9"/>

  <!-- AI neural network (left side) — 4 nodes connected in a brain-like pattern -->
  <g stroke="#7c3aed" stroke-width="2.5" fill="#7c3aed">
    <!-- Connections -->
    <line x1="32" y1="42" x2="48" y2="58" stroke-linecap="round"/>
    <line x1="32" y1="42" x2="32" y2="74" stroke-linecap="round"/>
    <line x1="32" y1="74" x2="48" y2="58" stroke-linecap="round"/>
    <line x1="32" y1="74" x2="48" y2="86" stroke-linecap="round"/>
    <line x1="48" y1="58" x2="48" y2="86" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="32" cy="42" r="6"/>
    <circle cx="32" cy="74" r="6"/>
    <circle cx="48" cy="58" r="7" fill="#a78bfa"/>
    <circle cx="48" cy="86" r="6"/>
  </g>

  <!-- BOM document (right side) — inventory list panel -->
  <g>
    <!-- Document body -->
    <rect x="68" y="36" width="34" height="56" rx="3" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/>
    <!-- Inventory lines (representing components) -->
    <line x1="74" y1="48" x2="96" y2="48" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="74" y1="58" x2="92" y2="58" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="74" y1="68" x2="96" y2="68" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="74" y1="78" x2="88" y2="78" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Folded corner -->
    <path d="M 96 36 L 102 36 L 102 42 Z" fill="#3b82f6"/>
  </g>

  <!-- EU compliance star (top-right accent) -->
  <g transform="translate(95, 28)">
    <circle cx="0" cy="0" r="10" fill="#fbbf24"/>
    <polygon points="0,-5 1.5,-1.5 5,-1.5 2,1 3,4.5 0,2.5 -3,4.5 -2,1 -5,-1.5 -1.5,-1.5" fill="#1a1a2e"/>
  </g>
</svg>
