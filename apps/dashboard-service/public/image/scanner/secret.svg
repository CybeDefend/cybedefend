<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="58" fill="#1a1a2e" opacity="0.9"/>

  <!-- Key body -->
  <g transform="translate(28, 30) rotate(-30, 36, 36)">
    <!-- Key head (circle with hole) -->
    <circle cx="26" cy="26" r="20" fill="none" stroke="#7c3aed" stroke-width="5"/>
    <circle cx="26" cy="26" r="8" fill="#1a1a2e"/>

    <!-- Key shaft -->
    <rect x="44" y="23" width="35" height="6" rx="2" fill="#7c3aed"/>

    <!-- Key teeth -->
    <rect x="65" y="29" width="5" height="10" rx="1" fill="#7c3aed"/>
    <rect x="74" y="29" width="5" height="7" rx="1" fill="#7c3aed"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(58, 55)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <line x1="32" y1="32" x2="46" y2="46" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Alert dot -->
  <circle cx="100" cy="25" r="10" fill="#ef4444"/>
  <text x="100" y="30" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="white">!</text>
</svg>
