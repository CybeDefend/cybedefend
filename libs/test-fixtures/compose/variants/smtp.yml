# Smoke variant « smtp »: an SMTP server (Mailpit) receives the instance's e-mails.
# Layered after deploy/community/docker-compose.yml; MAILPIT_HTTP_PORT is a free
# host port the smoke runner writes into its .env.

services:
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    networks: [cybedefend]
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

  global-management:
    environment:
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_SECURE: "false"
      EMAIL_FROM: CybeDefend <cybedefend@example.test>
    depends_on:
      mailpit:
        condition: service_healthy
