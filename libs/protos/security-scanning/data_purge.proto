syntax = "proto3";

package cybedefend.security_scanning;

import "data-purge/data_purge.proto";

// Purges this service's data of a deleted project, team or organization.
// Declares only the RPCs this service implements; see data-purge/data_purge.proto.
service DataPurgeService {
  rpc PurgeProjectData (cybedefend.data_purge.PurgeProjectDataRequest) returns (cybedefend.data_purge.PurgeDataResponse);
}
