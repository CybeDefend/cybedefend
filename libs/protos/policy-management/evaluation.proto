syntax = "proto3";

package cybedefend.policy_management;

import "policy-management/policy_types.proto";

// ============================================================================
// Policy Evaluation Request/Response Messages
// ============================================================================

message TriggerEvaluationRequest {
  string scan_id = 1;
  string project_id = 2;
  string organization_id = 3;
  optional string team_id = 4;
  string triggered_by = 5;
  optional string branch = 6;
}

message TriggerEvaluationResponse {
  string evaluation_id = 1;
  EvaluationStatus status = 2;
  string message = 3;
}

message TriggerOsvBasedEvaluationRequest {
  repeated string project_ids = 1;
  string triggered_by = 2;
}

message TriggerOsvBasedEvaluationResponse {
  int32 affected_projects_count = 1;
  int32 evaluations_triggered = 2;
  string message = 3;
}

message GetEvaluationStatusRequest {
  string evaluation_id = 1;
}

message GetEvaluationStatusResponse {
  string evaluation_id = 1;
  EvaluationStatus status = 2;
  int32 progress_percentage = 3;
  string message = 4;
  int64 started_at = 5;
  int64 completed_at = 6;
}

message GetEvaluationStatusByScanIdRequest {
  string scan_id = 1;
  string project_id = 2;
}

message GetEvaluationStatusByScanIdResponse {
  bool has_evaluation = 1;
  optional string evaluation_id = 2;
  EvaluationStatus status = 3;
  int32 progress_percentage = 4;
  string message = 5;
  int64 started_at = 6;
  int64 completed_at = 7;
}

message GetComplianceResultRequest {
  string scan_id = 1;
  string project_id = 2;
}

message GetComplianceResultResponse {
  ComplianceResult result = 1;
  EvaluationStatus status = 2;
}

message GetComplianceHistoryRequest {
  string project_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  optional int64 from_date = 4;
  optional int64 to_date = 5;
}

message GetComplianceHistoryResponse {
  repeated ComplianceResult results = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message DryRunEvaluationRequest {
  string project_id = 1;
  string scan_id = 2;
  optional string policy_config_json = 3;
}

message DryRunEvaluationResponse {
  ComplianceResult result = 1;
}
