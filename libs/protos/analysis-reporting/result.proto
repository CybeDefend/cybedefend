syntax = "proto3";

package cybedefend.analysis_reporting;

// -------------------------------------------------------------------
// Shared messages for scan results
// -------------------------------------------------------------------

message ImportLocation {
  string file = 1;   // relative file path (e.g. "src/utils/helpers.ts")
  int32 line = 2;    // line number (1-indexed)
  string content = 3; // actual source code line content
}

message Library {
  string name      = 1;
  string version   = 2;
  string file      = 3;
  string ecosystem = 4;
  bool is_transitive = 5;
  bool is_dev = 6;
  repeated string path = 7;
  optional bool dependency_info_available = 8; // true if isDev/isTransitive are reliable, false/unset means unknown
  optional string reachability = 9;              // "used", "test_only", "unused", "potentially_used", "unknown", or absent
  repeated ImportLocation import_locations = 10; // files/lines where package is imported
  repeated string licenses = 11;                 // SPDX license identifiers
  optional string license_expression = 12;       // Original SPDX expression (e.g. "MIT OR GPL-3.0-only")
}

// -------------------------------------------------------------------
// CybeRisk Score
// -------------------------------------------------------------------
//
// Risk-based prioritization score replacing the legacy severity-only
// `risk_score`/`risk_level`. The score is the UNBOUNDED sum of per-vuln
// CVSS-based points (round(Σ pointsFromVuln(v))) over the project's active
// vulnerabilities, scoped to the project reference branch (main/master
// fallback). There is no upper cap and no business/exposure multiplier —
// contextualisation lives inside each vuln's environmental CVSS. The score is
// persisted per project and recomputed asynchronously by a worker; reads are
// O(1).
//
// `breakdown` is OPTIONAL: omitted in lightweight listings, populated for the
// project overview page so the UI can explain the score.

message CyberRiskScore {
  // Final score: unbounded non-negative integer (sum of CVSS-based points). Not
  // capped at 100 — large projects can exceed it.
  int32 score = 1;
  // Categorical level derived from score buckets: critical|high|medium|low|none.
  string level = 2;
  // Per-component breakdown. Populated for detail endpoints, may be omitted in
  // listings to keep responses light.
  optional CyberRiskBreakdown breakdown = 3;
  // ISO 8601 timestamp at which the persisted score was last (re)computed by the
  // recompute worker.
  string computed_at = 4;
}

message CyberRiskBreakdown {
  // Sum of CVSS-based points across active vulns — equal to the final score.
  double base = 1;
  // Deprecated: business/exposure multipliers were removed from the score and are
  // always 1. Contextualisation now lives in each vuln's environmental CVSS.
  double business_multiplier = 2 [deprecated = true];
  // Deprecated: see business_multiplier. Always 1.
  double exposure_multiplier = 3 [deprecated = true];
  // Per-scan-type contribution to the score.
  map<string, CyberRiskScanTypeContribution> by_scan_type = 4;
  // Top contributing vulnerabilities (max 5), sorted by descending contribution.
  repeated CyberRiskTopContributor top_contributors = 5;
  // Deprecated: no longer populated; business context is not part of
  // the score anymore.
  CyberRiskBusinessContext business_context = 6;
  // Deprecated: no longer populated; exposure context is not part of
  // the score anymore.
  CyberRiskExposureContext exposure_context = 7;
}

message CyberRiskScanTypeContribution {
  // Count of vulnerabilities considered per severity (active states only).
  int32 critical = 1;
  int32 high = 2;
  int32 medium = 3;
  int32 low = 4;
  // Sum of CVSS-based points contributed by this scan type.
  double weighted_score = 5;
  // Deprecated: reachability no longer feeds the score. Always 0.
  double avg_reachability_factor = 6;
}

message CyberRiskTopContributor {
  string vulnerability_id = 1;
  // Scan type discriminator: SAST | SCA | IAC | CICD | CONTAINER | SECRET.
  string scan_type = 2;
  // critical | high | medium | low
  string severity = 3;
  // SCA only: used | potentially_used | unused
  string reachability = 4;
  // SAST/IaC/CICD: not_exploitable | theoretical | proven | actively_exploited
  string exploitability_verdict = 5;
  // CVSS-based points contributed by this single vulnerability.
  double contribution = 6;
}

message CyberRiskBusinessContext {
  string business_criticality = 1; // low | medium | high | mission_critical
  bool handles_pii = 2;
  bool handles_payment_data = 3;
  bool safety_critical = 4;
  string data_classification = 5; // public | internal | confidential | regulated
}

message CyberRiskExposureContext {
  string internet_exposure = 1; // public | internal | airgapped
  string environment = 2;       // production | staging | development
  string deployment_type = 3;   // saas | onprem | embedded | mobile
}

message ProjectDeleteRequest {
  string projectId = 1;
  // Org of the deleted project, captured by global-management before the
  // hard delete. Lets analysis-reporting mark the org's persisted KPI cards dirty
  // (markDirty by orgId) without a reverse projectId->org lookup that would fail
  // post-delete. Optional for backward compatibility with older callers.
  string organizationId = 2;
}

message ProjectDeleteResponse {
  string message = 1;
}

message ScanAddScaResultRequest {
  string project_id         = 1;
  string scan_id            = 2;
  string scanner_name       = 3;
  bool   is_last_request    = 4;
  string vulnerability_type = 5;
  repeated Library packages = 6;
}

message ScanAddScaResultResponse {
  string project_id = 1;
  string scan_id    = 2;
  string message    = 3;
}

message CodeStructure {
  int32  line    = 1;
  string content = 2;
}

message CodeSnippet {
  int32                vulnerable_start_line = 1;
  int32                vulnerable_end_line   = 2;
  int32                start_line            = 3;
  int32                end_line              = 4;
  repeated CodeStructure code                 = 5;
  string               language              = 6;
  string               path                  = 7;
}

message DataFlowItem {
  string        name_highlight = 1;
  int32         line           = 2;
  repeated CodeStructure code  = 3;
  string        language       = 4;
  string        path           = 5;
  string        type           = 6;
  int32         order          = 7;
}

// A `cybedefend-ignore` directive the scanner found on an issue's reported line
// or on the line directly above it. The scanner never drops an
// issue: analysis-reporting resolves (scanner, rule_id) to the catalogue rule's
// code (`CD-<TYPE>-<NNNN>`) and does not raise the finding when a directive
// lists that code, or when it is the bare form (all_rules).
message InlineIgnoreDirective {
  repeated string codes     = 1; // ids listed between brackets, trimmed, as written
  bool            all_rules = 2; // bare form `cybedefend-ignore: reason`
  string          reason    = 3;
  int32           line      = 4; // 1-based source line carrying the directive
}

// Rule metadata read from a SARIF file. Set only by
// the import; every cloud scanner leaves it unset and nothing changes for them.
// analysis-reporting creates a catalogue row from it when (tool_name, rule_id)
// has no correspondence.
message RuleMetadata {
  string          tool_name         = 1; // runs[].tool.driver.name, lower-cased, [a-z0-9._-], max 64
  string          rule_id           = 2; // result.ruleId (or rule.id), max 255
  string          name              = 3; // rule.name, else shortDescription.text, else rule_id, max 255
  string          short_description = 4; // max 1000
  string          full_description  = 5; // max 10000
  string          help_markdown     = 6; // help.markdown, else help.text, max 20000
  repeated string cwe               = 7; // "CWE-79", from tags "CWE-79" or "external/cwe/cwe-079" (leading zeros dropped), max 10
  string          severity          = 8; // critical | high | medium | low: the mapped severity of the FIRST result
                                         // of this (tool, rule) in the file; written to the catalogue, so the
                                         // stored findings of that rule take it
  string          help_uri          = 9; // https only, else empty
  repeated string owasp_top10       = 10; // "A01:2021" … "A10:2021", from rule tags matching
                                          // /\bA(0[1-9]|10):2021\b/i (Semgrep's "OWASP-A03:2021 - Injection"
                                          // gives "A03:2021"), upper-cased, deduplicated, max 10;
                                          // written to vulnerability.owaspTop10 by the catalogue fallback
}

message VulnerabilityDtoRequest {
  string          rule_id       = 1;
  string          language      = 2;
  repeated string cwe           = 3;
  repeated string owasp_top10   = 4;
  string          name          = 5;
  string          description   = 6;
  string          severity      = 7;
  string          confidence    = 8;
  string          path          = 9;
  string          file_hash     = 10;
  CodeSnippet     code_snippet  = 11;
  repeated DataFlowItem data_flow = 12;
  // Directives found on the reported line, then on the line above (0 to 2).
  repeated InlineIgnoreDirective inline_ignores = 13;
  // SARIF import only: the rule's metadata for the catalogue fallback.
  optional RuleMetadata rule_metadata = 14;
  // Secret-specific fields (populated only when vulnerability_type == 'secret').
  // The plaintext value is encrypted in analysis-reporting-service before persist.
  optional string secret_value  = 40;
  optional string commit_sha    = 41;
  optional string secret_source = 42; // "head" | "history"
  optional string secret_pass   = 43; // "head" | "history"
}

message ScanAddResultRequest {
  string                         project_id                   = 1;
  string                         scan_id                      = 2;
  string                         scanner_name                 = 3;
  string                         running_docker_image         = 4;
  string                         running_docker_image_version = 5;
  string                         started_at                   = 6; // ISO 8601
  string                         finished_at                  = 7; // ISO 8601
  bool                           is_last_request              = 8;
  string                         vulnerability_type           = 9;
  repeated VulnerabilityDtoRequest vulnerabilities            = 10;
  optional string                branch                       = 11; // Branch being scanned
  // Outcome of the git history pass: "ok" | "failed" | "none"
  optional string history_pass_outcome = 12;
  // Files whose findings this scanner dropped because the project's ignore
  // file excludes them. Sent on the last batch only. The receiver resolves the
  // findings it holds in these files, even when it would otherwise keep them.
  repeated string ignored_paths = 13;
}

message ScanAddResultResponse {
  string project_id = 1;
  string scan_id    = 2;
  string message    = 3;
  bool   success    = 4;
}

// security-scanning hands an import scan's file to analysis-reporting.
// Answers once the results-import job (results-import-<scan_id>) is queued; at
// most one job per scan_id (a repeated call answers accepted = true and queues nothing).
//   INVALID_ARGUMENT    IMPORT_INVALID_REQUEST  (format not "sarif", type not sast|iac|secret|cicd|sca|container,
//                                               a field missing, image missing with type container or set
//                                               with any other type)
//   UNAVAILABLE         (the queue cannot be reached)
message ImportResultsRequest {
  string scan_id            = 1;
  string project_id         = 2;
  string organization_id    = 3;
  string branch             = 4;
  string vulnerability_type = 5; // sast | iac | secret | cicd | sca | container (the last two: Community only)
  string format             = 6; // "sarif"
  string file_key           = 7; // "import/<project_id>/<scan_id>.sarif" whatever the compression (gzip is detected
                                 // from the first bytes); read with file-management GetImportDownloadUrl.
                                 // With container_id: "import/<project_id>/<scan_id>/<container_id>.sarif"
  optional string image     = 8; // container imports only: CreateScanRequest.import_image, verbatim
  // Community cluster scans only (only the Community cluster engine sets it): the scanner
  // container that produced the file. Set, the job is results-import-<scan_id>-<container_id>
  // and CompleteImportScan carries it back; absent, the job stays results-import-<scan_id>.
  optional string container_id = 9;
  // Community cluster scans only: the severities the project keeps, comma-separated, each
  // critical|high|medium|low. Absent: every severity is kept, as for a file import.
  optional string severities   = 10;
  // sca only: the CycloneDX SBOM sent with the SARIF,
  // "import/<project_id>/<scan_id>.sbom" for a file import and
  // "import/<project_id>/<scan_id>/<container_id>.sbom" for the sca container
  // (trivy fs) of a Community cluster scan (gzip detected from the first
  // bytes), read with file-management GetImportDownloadUrl. Its packages and
  // the SARIF's vulnerabilities are one picture of the branch: one import,
  // one finalization. Absent: the SARIF alone.
  optional string sbom_file_key = 11;
}

message ImportResultsResponse {
  bool accepted = 1;
}

// -------------------------------------------------------------------
// Generic project requests
// -------------------------------------------------------------------

message ProjectGetRequest {
  string project_id = 1;
}

// -------------------------------------------------------------------
// Vulnerability counts
// -------------------------------------------------------------------

message CountVulnerabilitiesTypeResponse {
  string type      = 1;
  optional string last_scan = 2; // ISO 8601
  string source    = 3;
  int32  critical  = 4;
  int32  high      = 5;
  int32  medium    = 6;
  int32  low       = 7;
}

message GetProjectVulnerabilitiesCountResponse {
  string                              project_id = 1;
  int32                               critical   = 2;
  int32                               high       = 3;
  int32                               medium     = 4;
  int32                               low        = 5;
  repeated CountVulnerabilitiesTypeResponse analyses = 6;
  // Replaced legacy `float risk_score` (slot 7) and `string risk_level`
  // (slot 8) with a structured CybeRisk score. Breakdown omitted in this
  // listing-oriented response to keep payload size minimal.
  reserved 7;
  reserved "risk_score";
  reserved 8;
  reserved "risk_level";
  CyberRiskScore cyber_risk = 10;
  // Date of the last scan across all analysis types (ISO 8601 format)
  optional string                     last_scan  = 9;
  // Distinct programming languages detected across the project's
  // SAST/IaC/CICD/Secret detections. Raw scanner spellings, deduped + sorted.
  // Consumed by global-management to populate ProjectInformationsResponse, then
  // by the gateway to derive codeGraphSupported.
  repeated string detected_languages = 11;
}

// The two fields of GetProjectVulnerabilitiesCountResponse that
// global-management's ProjectService/Get reads.
message GetProjectRiskSummaryRequest {
  string project_id = 1;
}

message GetProjectRiskSummaryResponse {
  string project_id = 1;
  // The persisted, branch-scoped CybeRisk score (breakdown omitted). A project
  // with no persisted row reads score 0 / level "none" and gets a backfill
  // recompute enqueued, as with GetVulnerabilitiesCount.
  CyberRiskScore cyber_risk = 2;
  // Same as GetProjectVulnerabilitiesCountResponse.detected_languages.
  repeated string detected_languages = 3;
}

// -------------------------------------------------------------------
// Batch Vulnerabilities Count (for multiple projects at once)
// -------------------------------------------------------------------

// A project's branch-scoping inputs: its configured reference branch and the
// git default branch of its linked repository, either "" when unknown.
message ProjectReferenceBranch {
  string project_id = 1;
  string reference_branch = 2;
  string default_branch = 3;
}

message GetBatchVulnerabilitiesCountRequest {
  repeated string project_ids = 1;
  // Each project is counted on the branches its CybeRisk is scoped on
  // (scopingBranchesFor): the reference branch, else the git default branch,
  // else main/master. Never the sum of every branch; a project absent from
  // this list gets main/master.
  repeated ProjectReferenceBranch reference_branches = 2;
}

message GetBatchVulnerabilitiesCountResponse {
  repeated GetProjectVulnerabilitiesCountResponse counts = 1;
}

// -------------------------------------------------------------------
// Project overview
// -------------------------------------------------------------------

message GetProjectOverviewRequest {
  string project_id = 1;
  repeated string branches = 2; // Filter by branch names (e.g., ["main", "develop"])
}

message TotalBySeverity {
  string severity = 1;
  int32  count    = 2;
}

message TotalByState {
  string state = 1;
  int32  count = 2;
}

message TotalByAnalysisType {
  string analysis_type = 1;
  int32  count         = 2;
}

message VulnerabilitiesOverTime {
  string date     = 1; // ISO 8601
  string severity = 2;
  int32  count    = 3;
}

message GetProjectOverviewResponse {
  repeated TotalBySeverity      total_by_severity      = 1;
  repeated TotalByState         total_by_state         = 2;
  repeated TotalByAnalysisType  total_by_analysis_type = 3;
  repeated VulnerabilitiesOverTime vulnerabilities_over_time = 4;
  // Replaced legacy `float risk_score` (slot 5) and `string risk_level`
  // (slot 6) with the CybeRisk score (unbounded sum of CVSS-based points,
  // branch-scoped) plus a detailed breakdown (top contributors, per-scan-type
  // contributions). Breakdown is always populated on this detail endpoint.
  reserved 5;
  reserved "risk_score";
  reserved 6;
  reserved "risk_level";
  CyberRiskScore cyber_risk = 7;
}

// -------------------------------------------------------------------
// Organization Overview (Enhanced with comprehensive filters)
// -------------------------------------------------------------------

message GetOrganizationOverviewRequest {
  string organization_id = 1;
  string user_id = 2; // Required for fetching projects from GlobalManagement

  // === Project & Team Filters ===
  repeated string project_ids = 3; // Filter by specific project IDs (empty = all projects)
  repeated string team_ids = 4; // Filter by specific team IDs (empty = all teams)
  string project_name_search = 5; // Search projects by name (partial match)
  string team_name_search = 6; // Search teams by name (partial match)

  // === Severity & Status Filters ===
  repeated string severity_filter = 7; // Filter by severity: CRITICAL, HIGH, MEDIUM, LOW
  repeated string status_filter = 8; // Filter by status: open, in_review, resolved, not_exploitable, ignored
  repeated string priority_filter = 9; // Filter by priority: urgent, high, medium, low

  // === Analysis Type Filters ===
  repeated string analysis_types = 10; // Filter by type: SAST, SCA, IAC, CONTAINER, CICD, SECRET

  // === Date Range Filters ===
  optional string date_from = 11; // Start date (ISO 8601) for vulnerability creation
  optional string date_to = 12; // End date (ISO 8601) for vulnerability creation

  // === Risk Level Filters ===
  // Renamed from `risk_levels` to align with CybeRisk score terminology.
  // Same valid values: critical, high, medium, low, none.
  reserved 13;
  reserved "risk_levels";
  repeated string cyber_risk_levels = 31;

  // === Code Filters ===
  repeated string languages = 14; // Filter by programming language
  repeated string branches = 15; // Filter by Git branches (e.g., ["main", "develop"])

  // === Trend & Comparison Options ===
  optional int32 trend_period_days = 16; // Period for trends (default: 7, options: 7, 14, 30, 60, 90)
  optional bool include_resolved = 17; // Include resolved vulnerabilities in counts (default: false)
  optional string comparison_period = 18; // Comparison: "week", "month", "quarter" for period-over-period

  // === Pagination & Sorting for Summaries ===
  optional int32 projects_page = 19; // Page number for projects summary (default: 1)
  optional int32 projects_page_size = 20; // Page size for projects summary (default: 50)
  optional int32 teams_page = 21; // Page number for teams summary (default: 1)
  optional int32 teams_page_size = 22; // Page size for teams summary (default: 50)
  optional string sort_by = 23; // Sort by: total_vulnerabilities, critical_count, risk_level, name
  optional string sort_order = 24; // Sort order: ASC, DESC

  // === Grouping & Aggregation ===
  optional string group_by = 25; // Group results by: team, project, analysis_type, severity

  // === Output Options ===
  optional bool include_projects_summary = 26; // Include per-project summary (default: true)
  optional bool include_teams_summary = 27; // Include per-team summary (default: true)
  optional bool include_over_time_data = 28; // Include vulnerabilities over time (default: true)
  optional int32 top_vulnerable_limit = 29; // Limit for top vulnerable projects (default: 10, max: 50)

  // === Autofix Filter ===
  optional bool has_autofix = 30; // Filter vulnerabilities with/without autofix records
}

// Extended project summary with additional metrics
message ProjectOverviewSummary {
  string project_id = 1;
  string project_name = 2;
  string team_id = 3;
  string team_name = 4;
  // Renamed from `risk_level`. Same values (critical|high|medium|low|none)
  // but now derived from the CybeRisk score (unbounded sum of CVSS-based points).
  reserved 5;
  reserved "risk_level";
  string cyber_risk_level = 24;
  int32 cyber_risk_score = 25; // unbounded (sum of points), optional sibling for sorting/UI
  int32 critical_count = 6;
  int32 high_count = 7;
  int32 medium_count = 8;
  int32 low_count = 9;
  int32 total_vulnerabilities = 10;
  int32 sast_count = 11;
  int32 sca_count = 12;
  int32 iac_count = 13;
  int32 container_count = 14;
  // New fields for enhanced summary
  int32 cicd_count = 15; // CICD vulnerabilities count
  int32 secret_count = 16; // Secret vulnerabilities count
  int32 open_count = 17; // Open (unresolved) vulnerabilities
  int32 resolved_count = 18; // Resolved vulnerabilities
  int32 new_last7_days = 19; // New vulnerabilities in last 7 days
  int32 resolved_last7_days = 20; // Resolved in last 7 days
  optional string last_scan_date = 21; // Last scan date for this project
  int32 autofix_available_count = 22; // Vulnerabilities with autofix available
  repeated string detected_languages = 23; // Languages detected in the project
}

// Extended team summary with additional metrics
message TeamOverviewSummary {
  string team_id = 1;
  string team_name = 2;
  int32 project_count = 3;
  int32 critical_count = 4;
  int32 high_count = 5;
  int32 medium_count = 6;
  int32 low_count = 7;
  int32 total_vulnerabilities = 8;
  // New fields for enhanced summary
  int32 critical_risk_projects = 15; // Projects with critical risk
  int32 high_risk_projects = 9; // Projects with high risk
  int32 medium_risk_projects = 10; // Projects with medium risk
  int32 low_risk_projects = 11; // Projects with low risk
  int32 new_last7_days = 12; // New vulnerabilities in last 7 days
  int32 resolved_last7_days = 13; // Resolved in last 7 days
  double avg_vulnerabilities_per_project = 14; // Average vulnerabilities per project
}

// Extended top vulnerable project with more details
message TopVulnerableProject {
  string project_id = 1;
  string project_name = 2;
  string team_name = 3;
  int32 vulnerability_count = 4;
  int32 critical_count = 5;
  int32 high_count = 6;
  // Renamed from `risk_level`. Same values derived from CybeRisk score.
  reserved 7;
  reserved "risk_level";
  string cyber_risk_level = 11;
  int32 cyber_risk_score = 12; // unbounded (sum of points), not capped at 100
  int32 open_count = 8;
  int32 new_last7_days = 9;
  optional string team_id = 10;
}

// New message for language distribution
message LanguageDistribution {
  string language = 1;
  int32 vulnerability_count = 2;
  int32 project_count = 3;
}

// New message for comparison data
message PeriodComparison {
  int32 current_period_count = 1;
  int32 previous_period_count = 2;
  double change_percentage = 3;
  string trend = 4; // "up", "down", "stable"
}

// New message for severity comparison
message SeverityComparison {
  string severity = 1;
  PeriodComparison comparison = 2;
}

// Pagination metadata for summaries
message PaginationMeta {
  int32 current_page = 1;
  int32 page_size = 2;
  int32 total_items = 3;
  int32 total_pages = 4;
}

// Applied filters for client reference
message AppliedFilters {
  repeated string project_ids = 1;
  repeated string team_ids = 2;
  repeated string severity_filter = 3;
  repeated string status_filter = 4;
  repeated string analysis_types = 5;
  optional string date_from = 6;
  optional string date_to = 7;
  repeated string languages = 8;
  repeated string branches = 9; // Changed from optional string branch to repeated string branches
  optional int32 trend_period_days = 10;
  optional bool include_resolved = 11;
}

message GetOrganizationOverviewResponse {
  string organization_id = 1;
  int32 total_projects = 2;
  int32 total_teams = 3;

  // Severity/state distribution arrays, the over-time series and the
  // period comparisons moved to dedicated lazy endpoints
  // (GetOrganizationSeverityDistribution / GetOrganizationStateDistribution /
  // GetOrganizationVulnerabilitiesOverTime). Scalars critical_issues..low_issues
  // (18-21) remain here for the always-visible KPIs.
  reserved 4, 5, 7, 25, 26;
  reserved "total_by_severity", "total_by_state", "vulnerabilities_over_time", "severity_comparison", "total_comparison";

  // Aggregated counts by analysis type across all projects
  repeated TotalByAnalysisType total_by_analysis_type = 6;

  // Summary per project
  repeated ProjectOverviewSummary projects_summary = 8;

  // Summary per team
  repeated TeamOverviewSummary teams_summary = 9;

  // Top most vulnerable projects
  repeated TopVulnerableProject top_vulnerable_projects = 10;

  // Risk distribution
  int32 critical_risk_projects = 40;
  int32 high_risk_projects = 11;
  int32 medium_risk_projects = 12;
  int32 low_risk_projects = 13;

  // Trends (based on trend_period_days parameter)
  int32 newIssuesLast7Days = 14;
  int32 solvedIssuesLast7Days = 15;

  // Main statistics (same as getMainStatistics)
  int32 solved_issues = 16;
  int32 new_issues = 17;
  int32 critical_issues = 18;
  int32 high_issues = 19;
  int32 medium_issues = 20;
  int32 low_issues = 21;

  // === New Enhanced Response Fields ===

  // Language distribution across the organization
  repeated LanguageDistribution language_distribution = 22;

  // Pagination metadata for summaries
  PaginationMeta projects_pagination = 23;
  PaginationMeta teams_pagination = 24;

  // Applied filters echo (for client reference)
  AppliedFilters applied_filters = 27;
  
  // Additional aggregated statistics
  int32 total_vulnerabilities = 28; // Grand total across all projects
  int32 open_vulnerabilities = 29; // Total open (unresolved)
  int32 autofix_available_count = 30; // Total with autofix available
  
  // Analysis type breakdown with details
  int32 sast_total = 31;
  int32 sca_total = 32;
  int32 iac_total = 33;
  int32 container_total = 34;
  int32 cicd_total = 35;
  int32 secret_total = 36;
  
  // Trend period used (echoed from request or default)
  int32 trend_period_days = 37;
  
  // Mean time to remediate (in days)
  optional double mean_time_to_remediate = 38;
  
  // Vulnerabilities by branch (if branch data available)
  repeated BranchVulnerabilityCount vulnerabilities_by_branch = 39;

