  string project_id       = 1;
  string vulnerability_id = 2;
}

message GetProjectVulnerabilityByIdResponse {
  string project_id       = 1;
  string vulnerability_id = 2;
  oneof vulnerability {
    VulnerabilitySast sast = 3;
    VulnerabilityIac  iac  = 4;
    VulnerabilitySca  sca  = 5;
    VulnerabilityCicd cicd = 6;
    VulnerabilitySecret secret = 7;
  }
  optional bool is_project_parsed  = 8; // True if project has been parsed by Potpie (code graph available)
}

message UpdateResultRequest {
  string project_id       = 1;
  string vulnerability_id = 2;
  string status           = 3;
  string priority         = 4;
  string comment          = 5;
  string user_id          = 6;
  // Exploitability fields (agent-produced verdict + backend-derived score)
  // DEPRECATED: ignored on the backend — the score is derived deterministically
  // from `exploitability_verdict`. Kept for wire compatibility.
  double exploitability_score    = 7 [deprecated = true];
  string exploitability_verdict  = 8;  // not_exploitable|theoretical|proven|actively_exploited
  string exploitability_reason   = 9;  // LLM reasoning for TP/FP verdict (markdown)
  string exploitability_source   = 10; // "agent" or "manual"
  string cvss4_env_adjustments   = 11; // JSON: {"MAV":"N","MAC":"L",...}
  string scoring_source          = 12; // "agent" when agent proposes scoring
  string exploitability_score_reason = 13; // LLM reasoning for the exploitability score (markdown)
  // Chat agent audit trail. Set by the gateway when the update is
  // triggered by a confirmed HITL tool call. Persisted on the resulting
  // HistoryItem so analysts can retrace which conversation produced which DB
  // mutation.
  string agent_tool_call_id      = 14;
  string agent_conversation_id   = 15;
  string agent_stream_id         = 16;
  // Qualitative exploitability factors judged by the agent on THIS
  // instance (never a copy of the scanner rule's CVSS vector, which the priority
  // calculator already weighs on its own dimension). JSON:
  // {"attack_vector":"network|adjacent|local",
  //  "attack_complexity":"low|high",
  //  "privileges_required":"none|low|high",
  //  "user_interaction":"none|required"}
  // Consumed only for a `proven` verdict on an agent-judged SAST/IaC/CI-CD
  // finding; the numeric score is still derived on the backend, never by the LLM.
  string exploitability_factors  = 17;
  // GRC export — MANDATORY when `status` is "ignored": the auditable
  // justification surfaced by GET /organization/:organizationId/findings as `dismissal_reason`. Enforced
  // in the gateway DTO (clean 400) AND again in analysis-reporting
  // (`assertDismissalReason`), because the batch path and any other gRPC caller
  // never touch the DTO and a check that only exists at the edge is not a
  // control. Deliberately a breaking change on the triage endpoint.
  optional string dismissal_reason = 18;
}

message UpdateProjectVulnerabilityResponse {
  string project_id       = 1;
  string vulnerability_id = 2;
}

// -------------------------------------------------------------------
// Batch Update Vulnerabilities
// -------------------------------------------------------------------

// Single vulnerability update item for batch operations
message BatchUpdateVulnerabilityItem {
  string vulnerability_id = 1; // Required: ID of the vulnerability to update
  optional string status  = 2;  // Optional: New status (to_verify, not_exploitable, resolved, etc.)
  optional string priority = 3; // Optional: New priority (critical_urgent, urgent, normal, low, very_low)
  optional string comment = 4;  // Optional: Comment to add (max 512 chars)
  // GRC export — mandatory when this item sets `status = "ignored"`.
  // Carried all the way through the async batch job so a bulk dismissal can
  // still satisfy `assertDismissalReason`; without it the guard would make
  // batch-ignore impossible rather than merely audited.
  optional string dismissal_reason = 5;
}

// Request to update multiple vulnerabilities at once
message BatchUpdateResultRequest {
  string project_id = 1; // Required: Project ID
  repeated BatchUpdateVulnerabilityItem items = 2; // Required: List of vulnerabilities to update
  string user_id = 3; // Required: User performing the update
  // Chat agent audit trail propagated to every HistoryItem in the
  // batch when the mutation is triggered by a confirmed HITL tool call.
  string agent_tool_call_id      = 4;
  string agent_conversation_id   = 5;
  string agent_stream_id         = 6;
}

// Result of a single vulnerability update in batch
message BatchUpdateResultItem {
  string vulnerability_id = 1; // ID of the vulnerability
  bool success = 2; // Whether the update was successful
  optional string error = 3;    // Error message if update failed
}

// Response for batch update operation
message BatchUpdateResultResponse {
  string project_id = 1; // Project ID
  int32 total_count = 2; // Total number of vulnerabilities processed
  int32 success_count = 3; // Number of successful updates
  int32 failure_count = 4; // Number of failed updates
  repeated BatchUpdateResultItem results = 5; // Detailed results per vulnerability
}

// -------------------------------------------------------------------
// Async tasks (background jobs surfaced in the dashboard tracker)
// -------------------------------------------------------------------

message AsyncTask {
  string task_id = 1;
  string type = 2;            // "vuln_batch_update"
  string status = 3;          // queued | running | completed | failed
  int32 total = 4;
  int32 processed = 5;
  int32 succeeded = 6;
  int32 failed = 7;
  string project_id = 8;
  string organization_id = 9;
  string user_id = 10;
  int64 created_at = 11;      // ms epoch
  int64 updated_at = 12;      // ms epoch
  string error = 13;
  string result_url = 14;     // PR/MR URL set by autofix tasks on completion
}

message EnqueueBatchUpdateRequest {
  string project_id = 1;
  string user_id = 2;
  repeated BatchUpdateVulnerabilityItem items = 3;
  string agent_tool_call_id = 4;
  string agent_conversation_id = 5;
  string agent_stream_id = 6;
}
message EnqueueBatchUpdateResponse {
  string task_id = 1;
  int32 total = 2;
}

message GetAsyncTaskRequest { string task_id = 1; }
message ListAsyncTasksRequest { string user_id = 1; }
message AsyncTaskList { repeated AsyncTask tasks = 1; }

// Persisted dismiss of a background task. user_id is the authenticated owner
// (owner-checked server-side); deletion is idempotent.
message DeleteAsyncTaskRequest {
  string user_id = 1;
  string task_id = 2;
}
message DeleteAsyncTaskResponse { bool success = 1; }

