  repeated string technology = 3;
  string confidence = 4;
  string impact = 5;
  string likelihood = 6;
  repeated string languages = 7;
}

message HistoryItemsWrapper {
  repeated HistoryItem items = 1;
}

// Plain-language CVSS 4.0 explanation
// Structured data; final FR/EN sentences are composed by the dashboard via i18n.
message CvssBaseExplanation {
  string severity            = 1; // critical|high|medium|low|none
  double base_score          = 2;
  string attack_origin       = 3; // network|adjacent|local|physical (from AV)
  string attack_complexity   = 4; // low|high (from AC)
  string auth_required       = 5; // none|low|high (from PR)
  string user_interaction    = 6; // none|passive|active (from UI)
  string confidentiality_impact = 7; // none|low|high (from VC)
  string integrity_impact       = 8; // none|low|high (from VI)
  string availability_impact    = 9; // none|low|high (from VA)
  bool   has_subsequent_impact  = 10; // true if SC|SI|SA != N
}

message CvssEnvDriver {
  string metric_key = 1; // CR|IR|AR|MAV|MAC|MAT|MPR|MUI|MVC|MVI|MVA|MSC|MSI|MSA
  string value      = 2;
  optional string base_key   = 3; // for M* metrics: corresponding base key (e.g. AV for MAV)
  optional string base_value = 4; // value of base_key in the base vector
  string effect     = 5; // increases|decreases|neutral
}

message CvssEnvironmentalExplanation {
  double env_score   = 1;
  double base_score  = 2;
  double score_delta = 3; // env - base, rounded to 1 decimal
  string direction   = 4; // increased|decreased|unchanged
  repeated CvssEnvDriver drivers = 5;
}

message CvssExplanation {
  optional CvssBaseExplanation          base          = 1;
  optional CvssEnvironmentalExplanation environmental = 2;
}

message VulnerabilitySastIacResponse {
  string                           id                     = 1;
  string                           project_id             = 2;
  string                           created_at             = 3; // ISO 8601
  string                           update_at              = 4; // ISO 8601
  string                           time_to_fix            = 5;
  string                           current_state          = 6;
  string                           current_severity       = 7;
  string                           current_priority       = 8;
  string                           contextual_explanation = 9;
  string                           language               = 10;
  string                           path                   = 11;
  int32                            vulnerable_start_line  = 12;
  int32                            vulnerable_end_line    = 13;
  VulnerabilityMetadata            vulnerability          = 14;
  HistoryItemsWrapper history_items = 15;
  repeated CodeSnippetDto          code_snippets          = 16;
  string                           vulnerability_type     = 17;
  repeated AutoFixRecordDto        autofix_records        = 18;
  bool                             has_cybe_analysis      = 19; // True if the AI analysis has analyzed this vulnerability
  bool                             has_cybe_autofix       = 20; // True if vulnerability has autofix records
  optional string                  branch                 = 21; // Branch where this vulnerability was detected
  optional string                  cvss4_vector              = 22;
  optional double                  cvss4_base_score          = 23;
  optional double                  cvss4_environmental_score = 24;
  optional string                  cvss4_environmental_vector = 35;
  optional double                  epss_score                = 25;
  optional double                  epss_percentile           = 26;
  optional string                  epss_refreshed_at         = 27; // ISO 8601
  string                           scoring_source            = 28; // "static" or "agent"
  // Exploitability fields
  optional double                  exploitability_score      = 29; // 0.0-1.0
  optional string                  exploitability_verdict    = 30; // not_exploitable|theoretical|proven|actively_exploited
  optional string                  exploitability_reason     = 31; // LLM reasoning for TP/FP verdict (markdown)
  optional string                  exploitability_source     = 32; // "agent" or "manual"
  optional string                  exploitability_updated_at = 33; // ISO 8601
  // User-facing 0-100 priority score (compositeScore * 100, 1 decimal)
  optional double                  priority_score            = 34;
  // Plain-language CVSS explanation (structured, FR/EN composed dashboard-side)
  optional CvssExplanation         cvss_explanation          = 36;
  // Stale agent analysis flag — true when exploitabilitySource='agent'
  // AND exploitabilityUpdatedAt < ProjectSecurityContext.updatedAt.
  optional bool                    exploitability_stale         = 37;
  // ISO 8601 timestamp of the project security context (used by the
  // dashboard banner to render "the context was changed X days ago").
  optional string                  security_context_updated_at  = 38;
  // LLM reasoning for the exploitability score (separate from exploitability_reason which justifies the TP/FP verdict)
  optional string                  exploitability_score_reason  = 39;
  // The rule id of the tool that produced an IMPORTED finding (a SARIF
  // `result.ruleId`, as written in the file). Set only for findings imported
  // from a SARIF file; absent for every finding a built-in scanner raised.
  optional string                  scanner_rule_id              = 40;
}

