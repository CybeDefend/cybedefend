// === Dedicated lazy endpoints carved out of the org overview ===

// Shared filter surface for the 3 split endpoints. Carries exactly the filter
// fields consumed by the severity/state/over-time aggregations (i.e. those that
// feed FilterContext). Intentionally omits GetOrganizationOverviewRequest's
// project_name_search, team_name_search, priority_filter, languages,
// cyber_risk_levels and has_autofix — none of those affect these aggregations —
