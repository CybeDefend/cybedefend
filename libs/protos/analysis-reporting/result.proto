  string message = 2;
}

// ===================================================================
// GROUPED VULNERABILITIES - New endpoints for consolidated view
// Groups vulnerabilities by rule ID (SAST/IAC/CICD/Secret) or CVE+package (SCA)
// ===================================================================

// Severity breakdown for pie charts
message SeverityBreakdown {
  int32 critical = 1;
  int32 high = 2;
  int32 medium = 3;
  int32 low = 4;
}

// Individual occurrence of a vulnerability (SAST/IAC/CICD/Secret)
message VulnerabilityOccurrence {
  string id = 1;
  string path = 2;
  int32 vulnerable_start_line = 3;
  int32 vulnerable_end_line = 4;
  string current_state = 5;
  string current_severity = 6;
  string current_priority = 7;
  string created_at = 8;
  repeated AutoFixRecordDto autofix_records = 9;
  bool has_autofix = 10;
  bool has_cybe_analysis = 11;
  optional string source = 12; // "head" | "history" (secret only)
  // Scoring fields
  optional double cvss4_base_score          = 13;
  optional double cvss4_environmental_score = 14;
  optional double exploitability_score      = 15;
  optional string exploitability_verdict    = 16;
  optional double priority_score            = 17;
  // Lets the grouped tables flag an agent analysis that dates from
  // a previous scan, like the detailed rows do (same fields as 32/33/37 of
  // the detailed SAST/IaC/CI-CD message).
  optional string exploitability_source     = 18; // "agent" or "manual"
  optional string exploitability_updated_at = 19; // ISO 8601
  // Stale agent analysis flag — true when exploitabilitySource='agent'
  // AND exploitabilityUpdatedAt < ProjectSecurityContext.updatedAt.
  optional bool   exploitability_stale      = 20;
}

// Grouped vulnerability for SAST/IAC/CICD/Secret
message GroupedVulnerability {
  string rule_id = 1;
  VulnerabilityMetadata vulnerability = 2;
  int32 occurrence_count = 3;
  SeverityBreakdown severity_breakdown = 4;
  string highest_severity = 5;
  string language = 6;
  repeated VulnerabilityOccurrence occurrences = 7;
  bool has_autofix = 8;
  string first_seen = 9;
  string last_seen = 10;
  bool has_cybe_analysis = 11;
  // Scoring fields
  optional double highest_cvss4                    = 12;
  optional string highest_exploitability_verdict   = 13;
}

// SCA occurrence (different from SAST as it includes package info)
message ScaVulnerabilityOccurrence {
  string id = 1;
  string path = 2;
  string package_version = 3;
  string current_state = 4;
  string current_severity = 5;
  string current_priority = 6;
  double current_cvss = 7;
  string created_at = 8;
  bool is_dev = 9;
  bool is_transitive = 10;
  bool has_autofix = 11;
  bool has_cybe_analysis = 12;
  // Scoring fields
  optional double exploitability_score      = 13;
  optional string exploitability_verdict    = 14;
  optional double cvss4_base_score          = 15;
  optional double cvss4_environmental_score = 16;
  optional double epss_score                = 17;
  optional double epss_percentile           = 18;
  optional double priority_score            = 19;
  optional bool   is_malware                = 20;
  string          file_name                 = 21; // manifest file (package.json, requirements.txt, ...)
}

// Grouped SCA vulnerability (by CVE + package name)
message GroupedScaVulnerability {
  string cve_id = 1;
  string package_name = 2;
  VulnerabilityScaMetadata vulnerability = 3;
  int32 occurrence_count = 4;
  SeverityBreakdown severity_breakdown = 5;
  string highest_severity = 6;
  double highest_cvss = 7;
  int32 dev_count = 8;
  int32 direct_count = 9;
  int32 transitive_count = 10;
  repeated ScaVulnerabilityOccurrence occurrences = 11;
  string first_seen = 12;
  string last_seen = 13;
  bool has_fix = 14;
  bool has_autofix = 15;
  bool has_cybe_analysis = 16;
  // Scoring fields
  optional string highest_exploitability_verdict = 17;
  optional double highest_cvss4                  = 18;
  // True when any occurrence in the group is malware.
  optional bool   is_malware                     = 19;
}

