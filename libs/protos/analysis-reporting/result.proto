// -------------------------------------------------------------------
// CONTAINER – Grouped Images by Repository (showing all tags)
// -------------------------------------------------------------------

// A single tag within a grouped container image
message ContainerImageTag {
  string id = 1; // Original image entity ID
  // Extracted tag from artifact_name (e.g., "v1.0.0", "latest"). EMPTY when the
  // image was scanned by digest only (`repo@sha256:...`): such an image carries
  // no tag at all, and inventing "latest" both mislabels it and makes two
  // digests of the same repository indistinguishable.
  string tag = 2;
  string scan_id = 3;
  string created_at = 4;
  string updated_at = 5;
  VulnerabilityCounts vuln_counts = 6; // Vulnerability counts for this specific tag
  // Full digest extracted from artifact_name (e.g. "sha256:<64 hex>"), empty
  // when the artifact was addressed by tag. Consumers rebuild the reference as
  // `repository_name@digest` — a digest is only addressable with '@'.
  string digest = 7;
  // This tag's base OS is end-of-support-life (see ContainerImage.os_eosl).
  bool os_eosl = 8;
}

// Grouped container image by repository name (without tag)
message GroupedContainerImage {
  string repository_name = 1; // Repository name without tag (e.g., "registry.gitlab.com/group/project")
  string project_id = 2;
  string os_family = 3;
  string os_name = 4;
  string branch = 5;
  int32 tag_count = 6; // Number of different tags for this image
  repeated ContainerImageTag tags = 7; // All tags for this repository
  VulnerabilityCounts aggregated_vuln_counts = 8; // Total vulnerability counts across all tags
  string latest_scan_at = 9; // Most recent scan date across all tags
  // True when ANY tag of the repository runs an end-of-support-life
  // base OS — conservative on purpose, the alert must not be missed.
  bool os_eosl = 10;
}

message GetGroupedContainerImagesRequest {
  string project_id = 1;
  optional int32 page = 2;
  optional int32 limit = 3;
  optional string branch = 4; // Filter by branch
  optional string sort = 5; // repository_name | tag_count | latest_scan_at
  optional string order = 6; // ASC | DESC
  optional string search_query = 7; // Search by repository name
}

message GetGroupedContainerImagesResponse {
  string project_name = 1;
  repeated GroupedContainerImage grouped_images = 2;
  int32 total_repositories = 3; // Total number of unique repositories
  int32 total_tags = 4; // Total number of tags across all repositories
  int32 total_pages = 5;
  int32 current_page = 6;
  int32 page_size = 7;
}


