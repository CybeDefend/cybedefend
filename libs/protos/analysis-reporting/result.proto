// ===================================================================
// POLICY EVALUATION - Get all vulnerabilities for a scan
// ===================================================================

// Request to get all vulnerabilities for a scan for policy evaluation
message GetScanVulnerabilitiesForPolicyRequest {
  string project_id = 1;
  string scan_id = 2;
}

// Unified vulnerability representation for policy evaluation
// Contains fields common across all scanner types
message PolicyVulnerabilityItem {
  string id = 1; // Vulnerability detection ID
  string title = 2; // Vulnerability title/name
  string severity = 3; // CRITICAL | HIGH | MEDIUM | LOW | INFO
  string scanner_type = 4; // SAST | SCA | IAC | CONTAINER | SECRET | CICD
  repeated string cwe = 5; // CWE IDs (e.g., ["CWE-79", "CWE-89"])
  optional double cvss_score = 6;   // CVSS score if available
  optional string file_path = 7;    // File path where vulnerability was found
  optional int32 start_line = 8;    // Start line number in file
  optional int32 end_line = 9;      // End line number in file
  repeated string owasp_top10 = 10; // OWASP Top 10 categories (e.g., ["A03:2021"])
  optional string cve_id = 11;      // CVE ID for SCA/Container vulns
  optional string package_name = 12; // Package name for SCA/Container
  optional string package_version = 13; // Package version for SCA/Container
  optional string rule_id = 14;     // Scanner rule ID
  bool is_new = 15; // Whether this was detected in current scan (not in previous)
  string status = 16; // open | fixed | false_positive | accepted_risk
  int64 detected_at = 17; // Timestamp of detection
  optional string artifact_name = 18; // Container image/artifact name (for CONTAINER type)
}

// Response containing all vulnerabilities for a scan
message GetScanVulnerabilitiesForPolicyResponse {
  string project_id = 1;
  string scan_id = 2;
  repeated PolicyVulnerabilityItem vulnerabilities = 3;
  int32 total_count = 4;
  // Counts by scanner type
  int32 sast_count = 5;
  int32 sca_count = 6;
  int32 iac_count = 7;
  int32 container_count = 8;
  int32 secret_count = 9;
  int32 cicd_count = 10;
}

// ===================================================================
// SCAN QUEUE STATUS - Check if all vulnerability processing is complete
// ===================================================================

// Request to get the processing status of a scan's vulnerability queue
message GetScanQueueStatusRequest {
  string scan_id = 1;
}

// Response containing the queue processing status for a scan
message GetScanQueueStatusResponse {
  string scan_id = 1;
  bool is_processing_complete = 2; // True if all jobs for this scan are done
  int32 pending_jobs = 3; // Number of jobs waiting to be processed
  int32 active_jobs = 4; // Number of jobs currently being processed
  int32 completed_jobs = 5; // Number of jobs completed
  int32 failed_jobs = 6; // Number of jobs that failed
  // Breakdown by queue type
  int32 sca_pending = 7;
  int32 sast_iac_pending = 8;
  int32 container_pending = 9;
}
// ===================================================================
// LICENSE SUMMARY - Aggregated license stats for a project
// ===================================================================

message GetProjectLicenseSummaryRequest {
  string project_id = 1;
  optional string branch = 2;
  // Ignored: the organization whose license policy applies is
  // resolved from project_id, never taken from the caller.
  optional string organization_id = 3;
  repeated string package_type = 4;
}

message LicenseSummaryItem {
  string spdx_id = 1;
  string name = 2;
  string category = 3;
  string risk = 4;
  string risk_description = 5;
  int32 count = 6;
}

message GetProjectLicenseSummaryResponse {
  string project_id = 1;
  int32 total_packages = 2;
  int32 packages_with_licenses = 3;
  int32 packages_without_licenses = 4;
  int32 permissive_count = 5;
  int32 weak_copyleft_count = 6;
  int32 strong_copyleft_count = 7;
  int32 unknown_count = 8;
  repeated LicenseSummaryItem licenses = 9;
  int32 ignored_count = 10;
}

// ===================================================================
// LICENSE DETAIL - Packages using a specific license
// ===================================================================

message GetPackagesByLicenseRequest {
  string project_id = 1;
  string spdx_id = 2;
  optional string branch = 3;
  // Ignored: the organization whose license policy applies is
  // resolved from project_id, never taken from the caller.
  optional string organization_id = 4;
  repeated string package_type = 5;
}

message LicensePackageItem {
  string package_name = 1;
  string package_version = 2;
  string ecosystem = 3;
  repeated string licenses = 4;
  bool is_transitive = 5;
  bool is_dev = 6;
  string id = 7;
  bool is_license_ignored = 8;
}

message GetPackagesByLicenseResponse {
  string spdx_id = 1;
  string name = 2;
  string category = 3;
  string risk = 4;
  string risk_description = 5;
  int32 total_count = 6;
  repeated LicensePackageItem packages = 7;
}

// ===================================================================
// LICENSE CLASSIFICATION OVERRIDES - Per-organization license settings
// ===================================================================

message LicenseClassificationItem {
  string spdx_id = 1;
  string name = 2;
  string default_category = 3;
  string current_category = 4;
  bool is_overridden = 5;
  bool is_custom = 6;
}

message GetLicenseClassificationsRequest {
  string organization_id = 1;
}

message GetLicenseClassificationsResponse {
  repeated LicenseClassificationItem licenses = 1;
}

message LicenseOverrideItem {
  string spdx_id = 1;
  string category = 2;
}

message UpdateLicenseClassificationsRequest {
  string organization_id = 1;
  repeated LicenseOverrideItem overrides = 2;
}

message UpdateLicenseClassificationsResponse {
  bool success = 1;
  int32 updated_count = 2;
}

message ResetLicenseClassificationsRequest {
  string organization_id = 1;
}

message ResetLicenseClassificationsResponse {
  bool success = 1;
}

message DeleteLicenseOverrideRequest {
  string organization_id = 1;
  string spdx_id = 2;
}

message DeleteLicenseOverrideResponse {
  bool success = 1;
}

// ===================================================================
// ASSIGN PACKAGE LICENSE - Manually assign a license to a package
// ===================================================================

message AssignPackageLicenseRequest {
  string project_id = 1;
  string package_id = 2;
  string spdx_id = 3;
}

message AssignPackageLicenseResponse {
  bool success = 1;
}

// ===================================================================
// SET PACKAGE LICENSE IGNORED - Toggle ignore for license analysis
// ===================================================================

message SetPackageLicenseIgnoredRequest {
  string project_id = 1;
  string package_id = 2;
  bool ignored = 3;
}

message SetPackageLicenseIgnoredResponse {
  bool success = 1;
}

// ===================================================================
// NOTIFY SECURITY CONTEXT UPDATED - Trigger CVSS env recalculation
// ===================================================================

message NotifySecurityContextUpdatedRequest {
  string project_id = 1;
}

message NotifySecurityContextUpdatedResponse {
  bool accepted = 1;
}

// ===================================================================
// PRIORITY DECOMPOSITION - Transparency into algorithmic priority
// ===================================================================

message GetPriorityDecompositionRequest {
  string project_id        = 1;
  string vulnerability_id  = 2;
  string vulnerability_type = 3; // sast, iac, sca, container, cicd, secret
}

message PriorityDecomposition {
  string priority              = 1;  // computed priority label
  double composite_score       = 2;  // raw composite score 0.0-1.0
  double cvss4_contribution    = 3;  // w1 * normalized_cvss4_env
  double epss_contribution     = 4;  // w2 * epss
  double exploit_contribution  = 5;  // w3 * exploitability
  double context_contribution  = 6;  // w4 * contextModifier
  double w1                    = 7;  // weight for CVSS4
  double w2                    = 8;  // weight for EPSS
  double w3                    = 9;  // weight for exploitability
  double w4                    = 10; // weight for context
  bool   is_manual_override    = 11; // true if priority was manually set
}

message GetPriorityDecompositionResponse {
  PriorityDecomposition decomposition = 1;
}

// ===================================================================
// TOP VULNERABILITIES - Cross-type top N by composite priority score
// ===================================================================

message TopVulnerabilityItem {
  string id = 1;
  string vulnerability_type = 2;  // sca, sast, iac, container, cicd, secret
  string name = 3;
  string description = 4;
  string severity = 5;
  double composite_score = 6;
  optional double cvss4_environmental_score = 7;
  optional string exploitability_verdict = 8;
  optional string exploitability_reason = 9;
  optional string file_path = 10;
  optional int32 line = 11;
  optional string cve_id = 12;
  repeated string cwe = 13;
  optional string package_name = 14;
  optional string exploitability_source = 15;  // agent | manual | static
  // LLM reasoning for the exploitability score (separate from exploitability_reason which justifies the TP/FP verdict)
  optional string exploitability_score_reason = 16;
}

message GetTopVulnerabilitiesRequest {
  string project_id = 1;
  int32 limit = 2;
}

message GetTopVulnerabilitiesResponse {
  repeated TopVulnerabilityItem items = 1;
}
