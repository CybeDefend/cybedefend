    int32 unknown = 5;
}

message ContainerOS {
  string family = 1;
  string name   = 2;
  bool   eosl   = 3;
}

message ContainerPackage {
  string id               = 1;
  string name             = 2;
  string version          = 3;
  string arch             = 4;
  string src_name         = 5;
  string src_version      = 6;
  string digest           = 7;
  repeated string licenses = 8;
  repeated string depends_on = 9;
  // Complete distribution version, `[epoch:]version[-release]`.
  // Trivy splits deb/rpm coordinates (Version "8.30", Release "3", Epoch),
  // and `version` keeps that split form so stored package rows do not move.
  // OSV advisories bound their ranges with the complete form, so the
  // backend refuses to match a deb/rpm package that lacks it.
  string full_version     = 10;
  // Same, for the SOURCE package (OSV keys Debian/Ubuntu/Alpine advisories
  // on the source name: `openssl`, not `libssl3`).
  string src_full_version = 11;
}

