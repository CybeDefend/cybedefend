// -------------------------------------------------------------------
// OWASP Top 10 Report Generation
// -------------------------------------------------------------------

message GenerateOwaspReportRequest {
  string project_id = 1;
  string format = 2; // "json" | "pdf" | "html"
  optional bool detailed = 3; // Default: true. If false, excludes Factors, Overview, Description, How to Prevent, Example Attack Scenarios, and References sections
  optional string branch = 4; // Filter vulnerabilities by branch. Empty/unset = all branches (current behavior).
  string user_id = 5; // Owner of the async report-generation task.
}

message GenerateOwaspReportResponse {
  string project_id = 1;
  string format = 2;
  // Content is dropped in favour of download_url. Kept for one
  // release with [deprecated = true] so an out-of-sync gateway pod that
  // still reads `content` does not crash — it just sees an empty string.
  string content = 3 [deprecated = true];
  string filename = 4; // Suggested filename
  string content_type = 5; // MIME type (application/json, text/html, application/pdf)
  string download_url = 6;       // Signed GCS read URL, 15min TTL
  uint64 expires_at_ms = 7;      // Epoch ms when download_url expires
  // Async generation: the report is now produced by the analysis worker.
  // The caller gets an id + status="queued" and polls REPORT_READY realtime
  // events, then refetches the signed URL via GetGeneratedReport.
  string report_id = 8;
  string status = 9; // "queued" | "ready" | "failed"
}

// -------------------------------------------------------------------
// CWE Top 25 Report Generation
// -------------------------------------------------------------------

message GenerateCweReportRequest {
  string project_id = 1;
  string format = 2; // "json" | "pdf" | "html"
  optional bool detailed = 3; // Default: true. If false, excludes detailed descriptions and statistics
  optional string branch = 4; // Filter vulnerabilities by branch. Empty/unset = all branches (current behavior).
  string user_id = 5; // Owner of the async report-generation task.
}

message GenerateCweReportResponse {
  string project_id = 1;
  string format = 2;
  // Content is dropped in favour of download_url. Kept for one
  // release with [deprecated = true] so an out-of-sync gateway pod that
  // still reads `content` does not crash — it just sees an empty string.
  string content = 3 [deprecated = true];
  string filename = 4; // Suggested filename
  string content_type = 5; // MIME type (application/json, text/html, application/pdf)
  string download_url = 6;       // Signed GCS read URL, 15min TTL
  uint64 expires_at_ms = 7;      // Epoch ms when download_url expires
  // Async generation: see GenerateOwaspReportResponse.report_id.
  string report_id = 8;
  string status = 9; // "queued" | "ready" | "failed"
}

// -------------------------------------------------------------------
// Generated report status / signed-URL refetch (async generation).
// The worker persists reportId -> {objectPath, kind, format, ...}; this RPC
// re-signs a fresh download URL on demand so it survives URL expiry and SSE
// reconnects (the REPORT_READY event is IDs-only).
// -------------------------------------------------------------------

message GetGeneratedReportRequest {
  string project_id = 1;
  string report_id = 2;
}

message GetGeneratedReportResponse {
  string report_id = 1;
  string status = 2;       // "queued" | "ready" | "failed"
  string report_kind = 3;  // "owasp" | "cwe" | "eu_ai_act" | "scanner_type"
  string format = 4;
  string filename = 5;
  string content_type = 6;
  string download_url = 7;  // Present only when status == "ready"
  uint64 expires_at_ms = 8; // Present only when status == "ready"
  string error = 9;         // Present only when status == "failed"
}

// -------------------------------------------------------------------
// Aggregated Report Generation (Organization, Team, Batch)
// -------------------------------------------------------------------

message ProjectBranchSelection {
  string project_id = 1;
  repeated string branches = 2;
}

message GenerateOrganizationReportRequest {
  string organization_id = 1;
  string user_id = 2; // For permission validation and GlobalManagement calls
  string report_type = 3; // "owasp" | "cwe" | "license"
  string format = 4; // "json" | "pdf" | "html"
  bool detailed = 5; // Default: true. If false, report is simplified
  string branch_filter = 6; // "all" | "reference" | "selected" - Default: "all"
  repeated ProjectBranchSelection project_branch_selections = 7; // Per-project branch selections when branch_filter is "selected"
}

message GenerateTeamReportRequest {
  string team_id = 1;
  string user_id = 2; // For permission validation and GlobalManagement calls
  string report_type = 3; // "owasp" | "cwe" | "license"
  string format = 4; // "json" | "pdf" | "html"
  bool detailed = 5; // Default: true. If false, report is simplified
  string branch_filter = 6; // "all" | "reference" | "selected" - Default: "all"
  repeated ProjectBranchSelection project_branch_selections = 7; // Per-project branch selections when branch_filter is "selected"
  string organization_id = 8; // Optional: for license override lookups
}

message GenerateBatchReportRequest {
  repeated string project_ids = 1;
  string user_id = 2; // For permission validation
  string report_type = 3; // "owasp" | "cwe" | "license"
  string format = 4; // "json" | "pdf" | "html"
  bool detailed = 5; // Default: true. If false, report is simplified
  string branch_filter = 6; // "all" | "reference" | "selected" - Default: "all"
  repeated ProjectBranchSelection project_branch_selections = 7; // Per-project branch selections when branch_filter is "selected"
  string organization_id = 8; // Optional: for license override lookups
}

message GenerateAggregatedReportResponse {
  string scope_type = 1; // "organization" | "team" | "batch"
  string scope_id = 2; // ID of organization/team or comma-separated project IDs
  string report_type = 3; // "owasp" | "cwe" | "license"
  string format = 4; // "json" | "pdf" | "html"
  // Content is dropped in favour of download_url. Kept for one
  // release with [deprecated = true] so an out-of-sync gateway pod that
  // still reads `content` does not crash — it just sees an empty string.
  string content = 5 [deprecated = true];
  string filename = 6; // Suggested filename
  string content_type = 7; // MIME type (application/json, text/html, application/pdf)
  int32 projects_count = 8; // Number of projects included in the report
  repeated string project_ids = 9; // List of project IDs included
  string download_url = 10;       // Signed GCS read URL, 15min TTL
  uint64 expires_at_ms = 11;      // Epoch ms when download_url expires
  // Async generation (parity with GenerateOwaspReportResponse): the handler
  // now enqueues a job and returns immediately. download_url/expires_at_ms are
  // empty until status == "ready".
  string report_id = 12;
  string status = 13; // "queued" | "ready" | "failed"
}

message GetGeneratedAggregatedReportRequest {
  string scope_type = 1;      // "organization" | "team"
  string scope_id = 2;        // organizationId (org route) | teamId (team route)
  string report_id = 3;
  string organization_id = 4; // org/batch owner; empty for team route
}

message GetGeneratedAggregatedReportResponse {
  string report_id = 1;
  string status = 2;        // "queued" | "ready" | "failed"
  string report_type = 3;   // "owasp" | "cwe" | "license" | "ai-act"
  string scope_type = 4;    // "organization" | "team" | "batch"
  string scope_id = 5;
  string format = 6;
  string filename = 7;
  string content_type = 8;
  string download_url = 9;  // present only when status == "ready"
  uint64 expires_at_ms = 10;// present only when status == "ready"
  string error = 11;        // present only when status == "failed"
}

// -------------------------------------------------------------------
// User-initiated report deletion (frees a quota slot + GCS object)
// -------------------------------------------------------------------

message DeleteGeneratedReportRequest {
  string project_id = 1; // authoritative owner; report must belong to it
  string report_id = 2;
}

message DeleteGeneratedReportResponse {
  bool success = 1;
}

message DeleteAggregatedReportRequest {
  string scope_type = 1;      // "organization" | "team" | "batch"
  string scope_id = 2;        // organizationId | teamId | CSV projectIds (batch)
  string organization_id = 3; // owning org; report must belong to it
  string report_id = 4;
}

message DeleteAggregatedReportResponse {
  bool success = 1;
}

// -------------------------------------------------------------------
// Paginated history of stored reports (no download_url; the URL is
// re-signed on demand via GetGeneratedReport / GetGeneratedAggregatedReport).
// Expired rows (expiresAt < now) are excluded. Two disjoint lists: per-project
// (generated_reports) and aggregated (aggregated_reports).
// -------------------------------------------------------------------

message ListGeneratedReportsRequest {
  string project_id = 1;
  int32 page = 2;       // 1-based; <=0 → 1
  int32 page_size = 3;  // default 20, clamped to [1,100]
}

message GeneratedReportSummary {
  string report_id = 1;
  string kind = 2;          // owasp | cwe | eu_ai_act | scanner_type
  string format = 3;
  string status = 4;        // queued | ready | failed
  string filename = 5;
  string branch = 6;
  int64 created_at_ms = 7;
  int64 expires_at_ms = 8;  // 0 = never expires
}

message ListGeneratedReportsResponse {
  repeated GeneratedReportSummary items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// Org-wide shared stored-report usage. `used` counts BOTH project and
// org/team/batch reports owned by the org (same count enforcement uses); the
// quota is therefore a single shared pool. Either organization_id or project_id
// identifies the org (project_id is resolved server-side).
message GetReportUsageRequest {
  string organization_id = 1;
  string project_id = 2;
}
message GetReportUsageResponse {
  int32 used = 1;
  int32 limit = 2; // maxStoredReports; -1 = unlimited / unknown
}

message ListAggregatedReportsRequest {
  string scope_type = 1;      // org route: "organization"; team route: "team"
  string scope_id = 2;        // teamId for the team route
  string organization_id = 3; // org route: filter all scopes owned by the org
  int32 page = 4;
  int32 page_size = 5;
}

message AggregatedReportSummary {
  string report_id = 1;
  string report_type = 2;   // owasp | cwe | license | ai-act
  string scope_type = 3;    // organization | team | batch
  string scope_id = 4;
  string format = 5;
  string status = 6;
  string filename = 7;
  int64 created_at_ms = 8;
  int64 expires_at_ms = 9;
}

message ListAggregatedReportsResponse {
  repeated AggregatedReportSummary items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// -------------------------------------------------------------------
