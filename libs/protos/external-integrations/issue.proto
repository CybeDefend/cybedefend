// ========== Jira Issue Service ==========

service JiraIssueService {
  // Create Jira issues for vulnerabilities detected in a project
  rpc CreateIssues(CreateJiraIssuesRequest) returns (CreateJiraIssuesResponse);
  // Link vulnerabilities to an existing Jira issue (DB-only, no Jira modification)
  rpc LinkExistingIssue(LinkJiraIssueRequest) returns (LinkJiraIssueResponse);
  // Get existing Jira issues for a project
  rpc GetProjectIssues(GetJiraProjectIssuesRequest) returns (GetJiraProjectIssuesResponse);
  // Sync issue statuses from Jira (handles key changes when tickets are moved)
  rpc GetIssueStatus(GetJiraIssueStatusRequest) returns (GetJiraIssueStatusResponse);
}

message CreateJiraIssuesRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Scan ID that triggered the issue creation
  string scanId = 3;
  // Issue creation mode
  IssueCreationMode mode = 4;
  // Vulnerabilities to create issues for
  repeated VulnerabilityInfo vulnerabilities = 5;
  // Base URL for CybeDefend links in issue descriptions
  string cybedefendBaseUrl = 6;
  // Jira project key to create issues in (e.g. "TRI")
  string jiraProjectKey = 7;
}

message CreateJiraIssuesResponse {
  bool success = 1;
  string message = 2;
  // Created issues
  repeated IssueInfo issues = 3;
  // Vulnerabilities that failed to create issues
  repeated string failedVulnerabilityIds = 4;
}

message LinkJiraIssueRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Jira issue key to link to (e.g. "TRI-142")
  string jiraIssueKey = 3;
  // Vulnerability IDs to link
  repeated string vulnerabilityIds = 4;
  // Scanner type for the vulnerabilities
  string scannerType = 5;
  // Vulnerability details for enriching the Jira ticket description
  repeated VulnerabilityInfo vulnerabilities = 6;
  // Base URL for CybeDefend links in Jira description
  string cybedefendBaseUrl = 7;
}

message LinkJiraIssueResponse {
  bool success = 1;
  string message = 2;
  IssueInfo issue = 3;
}

message GetJiraProjectIssuesRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Filter by issue state: open, closed, all
  string state = 3;
  // Filter by vulnerability IDs
  repeated string vulnerabilityIds = 4;
}

message GetJiraProjectIssuesResponse {
  bool success = 1;
  repeated IssueInfo issues = 2;
}

message GetJiraIssueStatusRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // External Jira issue keys to check status for
  repeated string externalIssueKeys = 3;
}

message JiraIssueStatusInfo {
  // Current Jira issue key (may differ from original if ticket was moved)
  string issueKey = 1;
  // Jira status name (e.g. "To Do", "In Progress", "Done")
  string status = 2;
  // Jira status category (e.g. "new", "indeterminate", "done")
  string statusCategory = 3;
  // Full URL to the issue
  string issueUrl = 4;
  // Whether a PR is linked to this issue (bonus US 4.3)
  bool hasPullRequest = 5;
}

message GetJiraIssueStatusResponse {
  bool success = 1;
  repeated JiraIssueStatusInfo statuses = 2;
}

// ========== Linear Issue Service ==========

// Refusals are the closed list documented in linear.proto
// (LINEAR_NOT_CONNECTED, LINEAR_NEEDS_RECONNECT, LINEAR_WORKSPACE_TAKEN,
// LINEAR_NO_TEAM, LINEAR_TEAM_NOT_FOUND, LINEAR_ISSUE_NOT_FOUND), carried by the
// RpcException message.
service LinearIssueService {
  // Create Linear issues for vulnerabilities detected in a project
  rpc CreateIssues(CreateLinearIssuesRequest) returns (CreateLinearIssuesResponse);
  // Link vulnerabilities to an existing Linear issue: stores the links and adds
  // the CybeDefend attachment on the issue; its description and fields are
  // never written
  rpc LinkExistingIssue(LinkLinearIssueRequest) returns (LinkLinearIssueResponse);
  // Get existing Linear issues for a project
  rpc GetProjectIssues(GetLinearProjectIssuesRequest) returns (GetLinearProjectIssuesResponse);
  // Sync issue states from Linear (handles identifier changes when tickets are moved)
  rpc SyncIssueStatus(SyncLinearIssueStatusRequest) returns (SyncLinearIssueStatusResponse);
  // Close, comment on or reopen the Linear issues linked to findings whose state
  // changed in CybeDefend
  rpc ApplyFindingStates(ApplyLinearFindingStatesRequest) returns (ApplyLinearFindingStatesResponse);
}

message CreateLinearIssuesRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Scan ID that triggered the issue creation
  string scanId = 3;
  // Issue creation mode
  IssueCreationMode mode = 4;
  // Vulnerabilities to create issues for
  repeated VulnerabilityInfo vulnerabilities = 5;
  // Base URL for CybeDefend links in issue descriptions
  string cybedefendBaseUrl = 6;
  // Linear team ID to create issues in; empty = the project's configured team
  string teamId = 7;
  // Linear project ID to attach the issues to (optional)
  string linearProjectId = 8;
  // Linear label IDs to add to the issues (optional)
  repeated string labelIds = 9;
  // Linear user ID to assign the issues to (optional)
  string assigneeId = 10;
  // Linear priority (0 none, 1 urgent, 2 high, 3 medium, 4 low); absent =
  // derived from the severity of the vulnerabilities
  optional int32 priority = 11;
}

message CreateLinearIssuesResponse {
  bool success = 1;
  string message = 2;
  // Created issues
  repeated IssueInfo issues = 3;
  // Vulnerabilities that failed to create issues
  repeated string failedVulnerabilityIds = 4;
}

message LinkLinearIssueRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Linear issue reference to link to: an identifier (e.g. "ENG-142") or the
  // issue URL
  string issueRef = 3;
  // Vulnerability IDs to link
  repeated string vulnerabilityIds = 4;
  // Scanner type for the vulnerabilities
  string scannerType = 5;
  // Vulnerability details for enriching the Linear issue description
  repeated VulnerabilityInfo vulnerabilities = 6;
  // Base URL for CybeDefend links in the Linear issue description
  string cybedefendBaseUrl = 7;
}

message LinkLinearIssueResponse {
  bool success = 1;
  string message = 2;
  IssueInfo issue = 3;
}

message GetLinearProjectIssuesRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Filter by issue state: open, closed, all
  string state = 3;
  // Filter by vulnerability IDs
  repeated string vulnerabilityIds = 4;
}

message GetLinearProjectIssuesResponse {
  bool success = 1;
  repeated IssueInfo issues = 2;
}

message SyncLinearIssueStatusRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
}

message SyncLinearIssueStatusResponse {
  bool success = 1;
  // Number of stored issues whose state, identifier or URL was updated
  int32 updated = 2;
}

message ApplyLinearFindingStatesRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Vulnerabilities whose state changed
  repeated string vulnerabilityIds = 2;
  // What happened to them: fixed, ignored or reopened
  string outcome = 3;
  // Reason shown in the Linear comment (optional)
  string reason = 4;
}

message ApplyLinearFindingStatesResponse {
  // Linear issues closed because all their linked findings are resolved
  int32 closed = 1;
  // Linear issues commented (some findings resolved, others still open; or reopened)
  int32 commented = 2;
}
