syntax = "proto3";

package cybedefend.external_integrations;

// ========== Common Issue Types ==========

/**
 * Represents a vulnerability to be included in an issue.
 * Used by both GitHub and GitLab issue creation services.
 */
message VulnerabilityInfo {
  // Unique identifier of the vulnerability detection
  string vulnerabilityId = 1;
  // Type of scanner: sast, sca, iac, container, secret
  string scannerType = 2;
  // Severity level: critical, high, medium, low
  string severity = 3;
  // Name or title of the vulnerability
  string name = 4;
  // Short description of the vulnerability
  string shortDescription = 5;
  // Detailed description with remediation info
  string description = 6;
  // File path where the vulnerability was found
  string filePath = 7;
  // Start line number (for code-based vulnerabilities)
  int32 startLine = 8;
  // End line number (for code-based vulnerabilities)
  int32 endLine = 9;
  // CWE identifiers (e.g., CWE-89)
  repeated string cwe = 10;
  // OWASP Top 10 categories
  repeated string owaspTop10 = 11;
  // CVSS score (0.0 - 10.0)
  float cvssScore = 12;
  // For SCA: affected package name
  string packageName = 13;
  // For SCA: affected package version
  string packageVersion = 14;
  // For SCA: fixed version if available
  string fixedVersion = 15;
  // External vulnerability ID (e.g., CVE-2024-1234, GHSA-xxx)
  string externalId = 16;
  // Direct URL to the vulnerability in CybeDefend interface
  string cybedefendUrl = 17;
  // Branch where vulnerability was detected
  string branch = 18;
}

/**
 * Issue creation mode determining how vulnerabilities are grouped.
 */
enum IssueCreationMode {
  ISSUE_CREATION_MODE_UNSPECIFIED = 0;
  // One issue per individual vulnerability (SCA only)
  ISSUE_CREATION_MODE_PER_VULNERABILITY = 1;
  // One issue per vulnerability type (grouped by rule ID)
  ISSUE_CREATION_MODE_PER_VULNERABILITY_TYPE = 2;
  // One issue per affected file
  ISSUE_CREATION_MODE_PER_FILE = 3;
}

/**
 * Represents a created or existing issue.
 */
message IssueInfo {
  // Platform-specific issue ID
  string issueId = 1;
  // Issue number (e.g., #42)
  int32 issueNumber = 2;
  // Issue title
  string title = 3;
  // Issue URL in the platform
  string url = 4;
  // Issue state: open, closed
  string state = 5;
  // Linked vulnerability IDs
  repeated string vulnerabilityIds = 6;
  // Creation timestamp (ISO8601)
  string createdAt = 7;
  // Last update timestamp (ISO8601)
  string updatedAt = 8;
  // Jira project key (e.g., "TEST") — only for Jira issues
  optional string jiraProjectKey = 9;
  // Jira priority name (e.g., "High") — only for Jira issues
  optional string jiraPriority = 10;
  // Jira assignee display name — only for Jira issues
  optional string jiraAssignee = 11;
  // Linear identifier (e.g., "ENG-142") — only for Linear issues
  optional string linearIdentifier = 12;
  // Linear team key (e.g., "ENG") — only for Linear issues
  optional string linearTeamKey = 13;
  // Linear priority label (e.g., "High") — only for Linear issues
  optional string linearPriority = 14;
  // Linear assignee display name — only for Linear issues
  optional string linearAssignee = 15;
  // Linear workflow state type (triage, backlog, unstarted, started, completed,
  // canceled) — only for Linear issues
  optional string linearStateType = 16;
}

// ========== GitHub Issue Service ==========

service GithubIssueService {
  // Create issues for vulnerabilities detected in a project
  rpc CreateIssues(CreateGithubIssuesRequest) returns (CreateGithubIssuesResponse);
  // Close issues when vulnerabilities are resolved or ignored
  rpc CloseIssue(CloseGithubIssueRequest) returns (CloseGithubIssueResponse);
  // Get existing issues for a project
  rpc GetProjectIssues(GetGithubProjectIssuesRequest) returns (GetGithubProjectIssuesResponse);
  // Update issue state (add comment, update labels)
  rpc UpdateIssue(UpdateGithubIssueRequest) returns (UpdateGithubIssueResponse);
}

message CreateGithubIssuesRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Scan ID that triggered the issue creation
  string scanId = 3;
  // Issue creation mode
  IssueCreationMode mode = 4;
  // Vulnerabilities to create issues for
  repeated VulnerabilityInfo vulnerabilities = 5;
  // Base URL for CybeDefend links in issue descriptions
  string cybedefendBaseUrl = 6;
}

message CreateGithubIssuesResponse {
  bool success = 1;
  string message = 2;
  // Created issues
  repeated IssueInfo issues = 3;
  // Vulnerabilities that failed to create issues
  repeated string failedVulnerabilityIds = 4;
}

message CloseGithubIssueRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Platform-specific issue number
  int32 issueNumber = 3;
  // Closing reason: resolved, ignored, false_positive
  string reason = 4;
  // Vulnerability IDs being resolved
  repeated string vulnerabilityIds = 5;
}

message CloseGithubIssueResponse {
  bool success = 1;
  string message = 2;
  IssueInfo issue = 3;
}

message GetGithubProjectIssuesRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Filter by issue state: open, closed, all
  string state = 3;
  // Filter by vulnerability IDs
  repeated string vulnerabilityIds = 4;
}

message GetGithubProjectIssuesResponse {
  bool success = 1;
  repeated IssueInfo issues = 2;
}

message UpdateGithubIssueRequest {
  // CybeDefend project ID
  string projectId = 1;
  // Organization ID for permission verification
  string organizationId = 2;
  // Issue number to update
  int32 issueNumber = 3;
  // Comment to add (optional)
  string comment = 4;
  // Labels to add (optional)
  repeated string addLabels = 5;
  // Labels to remove (optional)
  repeated string removeLabels = 6;
  // New body content (optional) - used when removing resolved vulnerabilities
  string body = 7;
  // New title (optional)
  string title = 8;
  // Remaining vulnerabilities after removing resolved ones
  repeated VulnerabilityInfo remainingVulnerabilities = 9;
  // Issue creation mode (needed to regenerate body)
  IssueCreationMode mode = 10;
  // Group key (needed to regenerate body)
  string groupKey = 11;
}

message UpdateGithubIssueResponse {
  bool success = 1;
  string message = 2;
  IssueInfo issue = 3;
}

